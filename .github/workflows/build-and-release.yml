name: Build and Release AutoLevel DJ

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (Apple Silicon / Universal)
    runs-on: macos-15

    steps:
      - name: Checkout repository (with autolevel-core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # autolevel-core is private: the default token cannot read it. Add a fine-grained
          # token with read access to divid3byzer0/autolevel-core as the CORE_REPO_TOKEN secret.
          token: ${{ secrets.CORE_REPO_TOKEN || github.token }}

      - name: Install Ninja
        run: brew install ninja

      - name: Configure CMake
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, AU, Standalone and Test
        run: cmake --build build --config Release

      - name: Run DSP Unit Tests
        run: ./build/dsp_test

      - name: Run Plugin Tests (box parity)
        run: ./build/plugin_test

      - name: Package macOS Artifacts
        run: |
          mkdir -p package/macOS
          cp -R "build/AutoLevelDJ_artefacts/Release/VST3/AutoLevel DJ.vst3" package/macOS/
          cp -R "build/AutoLevelDJ_artefacts/Release/AU/AutoLevel DJ.component" package/macOS/
          cp -R "build/AutoLevelDJ_artefacts/Release/Standalone/AutoLevel DJ.app" package/macOS/
          cd package/macOS
          zip -r "$GITHUB_WORKSPACE/autolevel-dj-macos.zip" .

      - name: Upload macOS Zip
        uses: actions/upload-artifact@v4
        with:
          name: autolevel-dj-macos
          path: autolevel-dj-macos.zip

  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with autolevel-core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # autolevel-core is private: the default token cannot read it. Add a fine-grained
          # token with read access to divid3byzer0/autolevel-core as the CORE_REPO_TOKEN secret.
          token: ${{ secrets.CORE_REPO_TOKEN || github.token }}

      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake (Ninja x64)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, Standalone, and Test
        run: cmake --build build --config Release

      - name: Run DSP Unit Tests
        run: .\build\dsp_test.exe

      - name: Run Plugin Tests (box parity)
        run: .\build\plugin_test.exe

      - name: Package Windows x64 Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/windows-x64 | Out-Null
          Copy-Item -Recurse -Path "build\AutoLevelDJ_artefacts\Release\VST3\AutoLevel DJ.vst3" -Destination package/windows-x64/
          Copy-Item -Recurse -Path "build\AutoLevelDJ_artefacts\Release\Standalone\AutoLevel DJ.exe" -Destination package/windows-x64/
          Compress-Archive -Path "package\windows-x64\*" -DestinationPath "autolevel-dj-windows-x64.zip"

      - name: Upload Windows x64 Zip
        uses: actions/upload-artifact@v4
        with:
          name: autolevel-dj-windows-x64
          path: autolevel-dj-windows-x64.zip

  build-windows-x86:
    name: Build Windows x86 (32-bit)
    runs-on: windows-latest

    steps:
      - name: Checkout repository (with autolevel-core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # autolevel-core is private: the default token cannot read it. Add a fine-grained
          # token with read access to divid3byzer0/autolevel-core as the CORE_REPO_TOKEN secret.
          token: ${{ secrets.CORE_REPO_TOKEN || github.token }}

      - name: Set up MSVC environment (x86)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Configure CMake (Ninja x86)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build VST3, Standalone, and Test
        run: cmake --build build --config Release

      - name: Run DSP Unit Tests
        run: .\build\dsp_test.exe

      - name: Run Plugin Tests (box parity)
        run: .\build\plugin_test.exe

      - name: Package Windows x86 Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/windows-x86 | Out-Null
          Copy-Item -Recurse -Path "build\AutoLevelDJ_artefacts\Release\VST3\AutoLevel DJ.vst3" -Destination package/windows-x86/
          Copy-Item -Recurse -Path "build\AutoLevelDJ_artefacts\Release\Standalone\AutoLevel DJ.exe" -Destination package/windows-x86/
          Compress-Archive -Path "package\windows-x86\*" -DestinationPath "autolevel-dj-windows-x86.zip"

      - name: Upload Windows x86 Zip
        uses: actions/upload-artifact@v4
        with:
          name: autolevel-dj-windows-x86
          path: autolevel-dj-windows-x86.zip

  build-windows-x86-vst2:
    name: Build Windows x86 VST2 (no JUCE, cross-compiled)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository (with autolevel-core submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CORE_REPO_TOKEN || github.token }}

      - name: Install MinGW-w64 (32-bit) and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-i686 wine wine32:i386 xvfb

      - name: Build AutoLevel DJ.dll (VST2, x86)
        run: vst2/build.sh build-vst2

      - name: Test under Wine (audio parity, state, parameters, editor)
        run: vst2/test.sh build-vst2

      - name: Package Windows x86 VST2
        run: |
          mkdir -p package/windows-x86-vst2
          cp "build-vst2/AutoLevel DJ.dll" package/windows-x86-vst2/
          cd package/windows-x86-vst2
          zip -r "$GITHUB_WORKSPACE/autolevel-dj-windows-x86-vst2.zip" .

      - name: Upload Windows x86 VST2 Zip
        uses: actions/upload-artifact@v4
        with:
          name: autolevel-dj-windows-x86-vst2
          path: autolevel-dj-windows-x86-vst2.zip

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows-x64, build-windows-x86, build-windows-x86-vst2]
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: autolevel-dj-macos

      - name: Download Windows x64 Artifact
        uses: actions/download-artifact@v4
        with:
          name: autolevel-dj-windows-x64

      - name: Download Windows x86 Artifact
        uses: actions/download-artifact@v4
        with:
          name: autolevel-dj-windows-x86

      - name: Download Windows x86 VST2 Artifact
        uses: actions/download-artifact@v4
        with:
          name: autolevel-dj-windows-x86-vst2

      - name: Determine Release Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Upload Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: AutoLevel DJ ${{ steps.tag_info.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            autolevel-dj-macos.zip
            autolevel-dj-windows-x64.zip
            autolevel-dj-windows-x86.zip
            autolevel-dj-windows-x86-vst2.zip
